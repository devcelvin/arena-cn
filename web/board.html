<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>榜单 - AI Arena 中文榜单</title>
  <meta name="description" content="AI Arena 中文榜单，arena.ai 全球 AI 模型对战排名的中文镜像，支持按名称/厂商搜索、按评分与票数排序、只看国产模型。">
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0d14" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%232563eb'/><text x='50' y='69' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>A</text></svg>">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="logo" aria-hidden="true">A</span>
        AI Arena 中文榜单 <small>国内可访问的每日镜像</small>
      </a>
      <span class="spacer"></span>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="切换深浅色主题">🌙 深色</button>
    </div>
  </header>

  <main class="wrap">
    <div class="crumb" id="crumb"></div>

    <div class="board-head">
      <h1 id="board-title">榜单</h1>
      <div class="meta" id="board-meta"></div>
    </div>

    <nav class="chip-nav" id="chip-nav" aria-label="切换榜单"></nav>

    <div class="card">
      <div class="toolbar">
        <div class="search-field" id="search-field">
          <span class="ic" aria-hidden="true">🔍</span>
          <label class="sr-only" for="filter-input">筛选模型</label>
          <input type="search" id="filter-input" placeholder="搜索模型名 / 厂商（支持中文，如「月之暗面」）" autocomplete="off">
          <button class="clear" id="filter-clear" type="button" aria-label="清除搜索">✕</button>
          <kbd>/</kbd>
        </div>
        <div class="seg" role="group" aria-label="筛选范围">
          <button type="button" id="seg-all" aria-pressed="true">全部厂商</button>
          <button type="button" id="seg-cn" aria-pressed="false">🇨🇳 只看国产</button>
        </div>
        <label class="sr-only" for="sort-select">排序方式</label>
        <select id="sort-select" class="icon-btn">
          <option value="rank:asc">排名 ↑</option>
          <option value="rank:desc">排名 ↓</option>
          <option value="score:desc">评分 ↓</option>
          <option value="score:asc">评分 ↑</option>
          <option value="votes:desc">票数 ↓</option>
          <option value="inputPrice:asc">输入价 ↑</option>
          <option value="outputPrice:asc">输出价 ↑</option>
          <option value="contextLength:desc">上下文 ↓</option>
        </select>
        <span class="count" id="result-count"></span>
      </div>
      <div id="scale-hint" class="scale-hint"></div>
      <div id="board-slot"><div class="empty">加载中…</div></div>
    </div>

    <footer class="footer">
      <p>数据来源 <a href="https://arena.ai/leaderboard" target="_blank" rel="noopener">arena.ai</a>（原 LMSYS Chatbot Arena）公开榜单页面，本站每日自动抓取快照并做中文化整理，仅供学习参考，与官方无关；排名与评分版权归原站所有。</p>
      <div class="links">
        <a href="index.html">← 返回首页</a>
        <a href="https://arena.ai/leaderboard" target="_blank" rel="noopener">原始榜单 ↗</a>
      </div>
    </footer>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
