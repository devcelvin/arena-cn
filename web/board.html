<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>榜单 - AI Arena 中文榜单</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>A</text></svg>">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <span class="logo">A</span>
        AI Arena 中文榜单 <small>国内可访问的每日镜像</small>
      </a>
      <span class="spacer"></span>
      <button class="icon-btn" id="theme-toggle" type="button">🌙 深色</button>
    </div>
  </header>

  <main class="wrap">
    <div class="crumb" id="crumb"></div>
    <div class="board-head">
      <h1 id="board-title">榜单</h1>
      <div class="meta" id="board-meta"></div>
    </div>
    <div class="card">
      <div class="toolbar">
        <input type="search" id="filter-input" placeholder="筛选模型 / 厂商 / 关键词…">
        <span class="count" id="result-count"></span>
      </div>
      <div id="scale-hint" class="muted" style="padding:8px 12px 0;font-size:12px"></div>
      <div id="board-slot"><div class="empty">加载中…</div></div>
    </div>

    <footer class="footer">
      <p>数据来源 <a href="https://arena.ai/leaderboard" target="_blank" rel="noopener">arena.ai</a>（原 LMSYS Chatbot Arena）公开榜单页面，本站每日自动抓取快照并做中文化整理，仅供学习参考，与官方无关；排名与评分版权归原站所有。</p>
    </footer>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
