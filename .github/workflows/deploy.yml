# Deploy — 构建静态站点并部署到 GitHub Pages + Gitee Pages 国内镜像
#
# 触发：push 前端/数据/流水线变更 / Daily Sync 有数据更新时显式触发 / 手动
# 防递归：Daily Sync 的数据提交带 [skip ci]，GitHub 会跳过 push 触发的所有工作流，
#         且它自己会在提交成功后用 workflow_dispatch 触发本流程，因此这里放开 data/**
#         不会造成循环（日常自动抓取走那条显式触发路径）。
# 2026-10-15 收拾：移除「Daily Sync completed 就触发」的 workflow_run 监听
#         —— 它与 Daily Sync 里的显式触发重复，每次同步成功会并发跑两个 Deploy。
#         现在唯一路径：有数据提交才部署（committed==1），无变化不空跑。
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'data/**'          # LMArena 旧源数据（保留归档，回退用）
      - 'data-aa/**'       # Artificial Analysis 主源数据（web/data 由本工作流生成）
      - 'scripts/**'       # 流水线逻辑变更同样需要重新部署
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 同步数据到 web/data
        run: node scripts/sync-web-data.mjs

      - name: 数据体检（缺失则阻断部署，避免上线空站）
        run: node scripts/check-data.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 国内镜像：Gitee Pages（需在仓库 Settings → Secrets 配置
  # GITEE_USERNAME / GITEE_PASSWORD / GITEE_REPO；未配置时本 job
  # 静默失败，不影响主站）
  gitee:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: 同步数据到 web/data
        run: node scripts/sync-web-data.mjs
      - uses: yanglbme/gitee-pages-action@main
        with:
          gitee-username: ${{ secrets.GITEE_USERNAME }}
          gitee-password: ${{ secrets.GITEE_PASSWORD }}
          gitee-repo: ${{ secrets.GITEE_REPO }}
          branch: main
          directory: web
