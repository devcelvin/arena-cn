# Daily Fetch — 每日自动抓取 arena.ai 榜单数据
#
# 时间：UTC 14:23 = 北京时间 22:23（避开整点 cron 排队高峰；
#       arena.ai 数据实时滚动，任意时刻抓取均有效）
# 手动补跑：Actions → Daily Fetch → Run workflow
name: Daily Fetch

on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:

permissions:
  contents: write   # 提交数据快照
  actions: write    # 触发 Deploy 工作流

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 抓取 + 解析 + 校验 + 落库
        run: |
          node scripts/fetch.mjs
          node scripts/build-data.mjs

      - name: 提交数据快照
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): snapshot $(date -u +%F) [skip ci]"
            git push
            echo "committed=1" >> "$GITHUB_ENV"
          else
            echo "数据无变化，跳过提交"
          fi

      # 主动触发部署（[skip ci] 已阻止 push 触发，这里显式触发）
      - name: 触发部署
        if: env.committed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
