# Daily Sync — 每日同步 LMArena 官方榜单数据集（Hugging Face · CC BY 4.0）
#
# 时间：UTC 14:23 = 北京时间 22:23（避开整点 cron 排队高峰）
# 手动补跑：Actions → Daily Sync → Run workflow
#
# ⚠️ 本项目不再抓取 arena.ai 站点页面（其 ToS §5 禁止 scrape / mirror / translate）。
#    数据源为官方主动发布、以 CC BY 4.0 授权的公开数据集，抓取脚本为 scripts/fetch-hf.mjs。
name: Daily Sync

on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:

permissions:
  contents: write   # 提交数据快照
  actions: write    # 触发 Deploy 工作流

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: 安装依赖（hyparquet：解析 parquet）
        run: npm install --no-audit --no-fund

      - name: 拉取数据集 + 校验 + 落库
        run: |
          node scripts/fetch-hf.mjs
          node scripts/build-data.mjs

      - name: 提交数据快照
        run: |
          git config user.name "arena-bot"
          git config user.email "arena-bot@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): snapshot $(date -u +%F) [skip ci]"
            git push
            echo "committed=1" >> "$GITHUB_ENV"
          else
            echo "数据无变化，跳过提交"
          fi

      # 主动触发部署（[skip ci] 已阻止 push 触发，这里显式触发）
      - name: 触发部署
        if: env.committed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
